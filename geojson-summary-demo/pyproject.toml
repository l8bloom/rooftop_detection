[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "geojson-summary-demo"
version = "0.1.0"
description = "Count the features in a GeoJSON FeatureCollection by geometry type and property value."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
geojson-summary = "geojson_summary.cli:main"

[tool.setuptools.packages.find]
include = ["geojson_summary*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
