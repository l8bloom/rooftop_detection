minimum_pre_commit_version: "4.0.0"
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv run ruff check --fix
        language: system
        types: [python]
        require_serial: true
      - id: ruff-format
        name: Ruff format
        entry: uv run ruff format
        language: system
        types: [python]
        require_serial: true
      - id: shfmt
        name: shfmt
        entry: shfmt
        language: system
        files: \.sh$
        args:
          - --write
          - --case-indent
          - --space-redirects
          - --language-dialect
          - bash
          - --binary-next-line
      - id: shellcheck-fix
        name: shellcheck autofix
        entry: bash -c 'shellcheck -f diff "$@" | patch "$@" || true'
        language: system
        files: \.sh$
      - id: taplo
        name: taplo
        entry: taplo fmt
        language: system
        files: \.toml$
  - repo: https://github.com/google/yamlfmt
    rev: v0.21.0
    hooks:
      - id: yamlfmt
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: check-toml
      - id: end-of-file-fixer
      - id: requirements-txt-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
